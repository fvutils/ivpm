# CI/CD for fvutils/ivpm on Forgejo Actions.
#
# Ported from .github/workflows/ci.yml. Four things differ from that workflow,
# and each is deliberate:
#
#  1. No third-party actions. A bare `uses:` resolves against code.forgejo.org
#     (Forgejo's DEFAULT_ACTIONS_URL), not github.com, so pypa/gh-action-pypi-publish
#     and JamesIves/github-pages-deploy-action are not available. Publishing is
#     plain `twine`, which also keeps GitHub off the critical path of a release.
#  2. Releases are tag-driven, not branch-driven. The GitHub workflow published
#     to PyPI on every push to master using a run-id-suffixed version. Here a
#     `v<version>` tag is the deliberate act; pushes to master still build and
#     test, but their dev-suffixed artifacts never reach PyPI.
#  3. Docs are published as an artifact, not pushed to a gh-pages branch.
#     Built HTML is a build output, never a git branch -- see
#     ~/Documents/dvkit-docs-publishing-design.md F2 and section 5.8. A host-side
#     poller picks up `docs-fvutils-ivpm` and stages it for review.
#  4. No ivpm git-url-map is installed. Unlike pssparser, ivpm's own
#     dependencies are all PyPI plus one upstream third-party repo
#     (github.com/olofk/fusesoc), none of which is mirrored to git.dvkit.org.
#     Just as importantly, a user-level ~/.config/ivpm/config.yaml would be read
#     by the test suite itself and would silently change what the cache and
#     clone integration tests exercise.
name: CI

on:
  - push
  - pull_request
  - workflow_dispatch

jobs:
  build-linux:
    # ubuntu-latest maps to catthehacker/ubuntu:act-22.04 on this runner:
    # Python 3.10, git and node, which is everything a pure-Python build needs.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Check for internal identifiers in tracked files
      # This repo is published to git.dvkit.org and mirrored to R2, so anything
      # committed here is public. Internal host names, tailnet addresses and
      # CGNAT-range IPs must not appear in tracked files -- if a build ever
      # needs one, it belongs in a repository secret, which is masked in logs.
      run: |
        pattern='perch-char\.ts\.net|\.ts\.net|a9550|100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]+\.[0-9]+'
        if git grep -nIE "$pattern" -- . ':!.forgejo/workflows/ci.yml' ; then
          echo "::error::internal identifier found in a tracked file (see matches above)"
          exit 1
        fi
        echo "OK: no internal identifiers in tracked files"

    - name: Bootstrap the ivpm environment
      # bootstrap.sh creates packages/python and runs `ivpm update -a` from the
      # source tree, which is also the most direct smoke test that ivpm can
      # resolve its own manifest.
      run: |
        ./bootstrap.sh
        ./packages/python/bin/python -m pip install --upgrade setuptools build twine
        # Build once with the source deps already present so egg-info exists and
        # entry points are discoverable via PYTHONPATH=src.
        ./packages/python/bin/python -m build --no-isolation .

    - name: Run tests
      env:
        # Deliberately NOT secrets.GITHUB_TOKEN: on Forgejo that is a token for
        # this instance, and the tests that use it talk to api.github.com. Set
        # an optional GH_API_TOKEN repository secret to raise the GitHub rate
        # limit; unset, it resolves to empty and ivpm falls back to
        # unauthenticated requests.
        GITHUB_TOKEN: ${{ secrets.GH_API_TOKEN }}
      run: |
        export PYTHONPATH=$(pwd)/src:$(pwd)/test
        ./packages/python/bin/python -m pytest test/unit -q

    - name: Stamp build version
      # Tag builds keep the clean BASE version; everything else gets a
      # .<run-id> dev suffix so an ordinary push can never produce a wheel whose
      # version could collide with a release on PyPI.
      run: |
        case "$GITHUB_REF" in
          refs/tags/*) echo "tag build -- leaving version clean" ;;
          *) sed -i 's/^SUFFIX = ""$/SUFFIX = ".'"$GITHUB_RUN_ID"'"/' src/ivpm/__version__.py ;;
        esac
        grep '^SUFFIX = ' src/ivpm/__version__.py

    - name: Build sdist and wheel
      run: |
        rm -rf dist/
        ./packages/python/bin/python -m build .
        ./packages/python/bin/python -m twine check dist/*
        ls -la dist/

    - name: Upload distributions
      uses: forgejo/upload-artifact@v4
      with:
        name: dist-ivpm
        path: dist/*
        if-no-files-found: error

  docs:
    # Runs against the built wheel rather than the source tree: conf.py loads
    # sphinxarg.ext, which imports ivpm's argument parser, so the package and
    # its runtime dependencies have to be importable. Installing the artifact
    # is what makes this a test of the documentation we would actually ship.
    needs: build-linux
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Download distributions
      uses: forgejo/download-artifact@v4
      with:
        name: dist-ivpm
        path: dist

    - name: Build HTML docs
      run: |
        python3 -m venv /tmp/docsenv
        /tmp/docsenv/bin/pip install -q --upgrade pip
        /tmp/docsenv/bin/pip install -q sphinx sphinx-jsonschema sphinx-argparse sphinx-rtd-theme
        /tmp/docsenv/bin/pip install -q dist/*.whl
        /tmp/docsenv/bin/python -c "import ivpm; print('ivpm importable:', ivpm.__file__)"
        /tmp/docsenv/bin/sphinx-build -M html ./docs/source build 2>&1 | tee /tmp/sphinx.log
        cp src/ivpm/share/ivpm.json build/html/
        cp src/ivpm/share/ivpm.json build/html/ivpm.schema.json
        touch build/html/.nojekyll
        rm -rf build/html/.doctrees build/doctrees

    - name: Fail on Sphinx warnings that would ship an empty page
      # sphinx-build exits 0 even when an extension fails to pull in content, so
      # the exit code alone is not a sufficient check.
      run: |
        n=$(grep -cE "WARNING: (autodoc|Unable to|Problems with)" /tmp/sphinx.log || true)
        if [ "$n" -gt 0 ]; then
          echo "::error::$n Sphinx content warnings -- pages would ship incomplete"
          grep -E "WARNING: (autodoc|Unable to|Problems with)" /tmp/sphinx.log | head -10
          exit 1
        fi
        echo "OK: no content-loss warnings"
        echo "generated pages: $(find build/html -name '*.html' | wc -l)"

    - name: Upload docs
      # Consumed by the host-side docs staging poller; see
      # ~/Documents/dvkit-docs-publishing-design.md section 5.5. The artifact
      # name is the <org>-<repo> convention that design depends on.
      uses: forgejo/upload-artifact@v4
      with:
        name: docs-fvutils-ivpm
        path: build/html/**
        if-no-files-found: error

  publish-pypi:
    # Releases only. Pushes to master produce dev-suffixed artifacts that must
    # never reach PyPI: a version number there can be yanked but never reused.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, docs]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Download distributions
      uses: forgejo/download-artifact@v4
      with:
        name: dist-ivpm
        path: dist

    - name: Check the tag matches the package version
      # Guards against tagging v2.20.0 while __version__.py still says 2.19.0,
      # which would publish a release under the wrong number, unfixably.
      run: |
        tag="${GITHUB_REF#refs/tags/v}"
        base=$(grep '^BASE = ' src/ivpm/__version__.py | sed 's/.*"\(.*\)".*/\1/')
        echo "tag=$tag  BASE=$base"
        if [ "$tag" != "$base" ]; then
          echo "::error::tag v$tag does not match BASE $base in src/ivpm/__version__.py"
          exit 1
        fi
        for f in dist/*; do
          case "$(basename "$f")" in
            ivpm-${base}-*.whl|ivpm-${base}.tar.gz) ;;
            *) echo "::error::artifact $(basename "$f") is not version ${base}"; exit 1 ;;
          esac
        done
        echo "OK: tag, source version and all artifacts agree on ${base}"

    - name: Publish to PyPI
      # Plain twine rather than a third-party action: this is the release path,
      # and it should not depend on GitHub being reachable. PYPI_API_TOKEN is an
      # organization secret on fvutils.
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        if [ -z "$TWINE_PASSWORD" ]; then
          echo "::error::PYPI_API_TOKEN is not visible to this repository"
          exit 1
        fi
        python3 -m venv /tmp/twineenv
        /tmp/twineenv/bin/pip install -q --upgrade pip twine
        /tmp/twineenv/bin/twine check dist/*
        /tmp/twineenv/bin/twine upload --non-interactive --skip-existing dist/*
        echo "published $(ls dist/ | wc -l) artifacts"
