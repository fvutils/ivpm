
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ivpm"
dynamic = ["version"]
dependencies = [
    "httpx>=0.28.1,<1.0",
    "pyyaml",
    "rich",
    "setuptools",
    "toposort",
    "tomli>=2.0; python_version < '3.11'",
]
authors = [
    {name = "Matthew Ballance", email = "matt.ballance@gmail.com"},
]
description = "IVPM (Integrated View Package Manager) is a project-local polyglot package manager."
license = {file = "LICENSE" }

[tool.setuptools.dynamic]
version = {attr = "ivpm.__version__._pkg_version"}

[project.scripts]
ivpm = "ivpm.__main__:main"

[tool.setuptools.package-data]
ivpm = ['scripts/*', 'templates/*', 'share/*', 'share/*.md', 'share/cmake/*', 'share/skills/*/*',
        'agent_plugins/schemas/*/*.json']

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    # Test-only oracle: cross-checks ivpm.agent_plugins.validate against a real
    # JSON Schema implementation. IVPM never uses it at runtime -- diagnostics
    # must not vary with what happens to be installed.
    "jsonschema>=4.0",
]

[project.entry-points."agent.skills"]
ivpm = "ivpm.skills:get_skill_dirs"

[project.entry-points."ivpm.handlers"]
python = "ivpm.handlers.package_handler_python:PackageHandlerPython"
direnv = "ivpm.handlers.package_handler_direnv:PackageHandlerDirenv"
agents = "ivpm.handlers.package_handler_agents:PackageHandlerAgents"
fusesoc = "ivpm.handlers.package_handler_fusesoc:PackageHandlerFuseSoC"
modules = "ivpm.handlers.package_handler_modules:PackageHandlerModules"
node = "ivpm.handlers.package_handler_node:PackageHandlerNode"
dv-flow = "ivpm.handlers.package_handler_dv_flow:PackageHandlerDvFlow"

[project.entry-points."ivpm.clone_providers"]
git = "ivpm.clone.git_clone_provider:GitCloneProvider"

[tool.pytest.ini_options]
# Bare `pytest` from the repo root collects only our unit tests. Without this,
# collection walks scratch/clone trees (tmp/, packages/, test/rundir/, ...) that
# contain third-party test files, which abort the run with INTERNALERROR.
testpaths = ["test/unit"]
norecursedirs = [
    "build", "dist", "out", "ou", "tmp", "v", "packages", "examples",
    "test/rundir", "test/log", "*.egg", ".*", "node_modules", "*_ws",
]
